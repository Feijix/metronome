<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metronome</title>
  <meta name="description" content="Practice metronome with gap training for developing internal timing">
  <meta name="theme-color" content="#06b6d4">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app">
    <!-- Settings icon (top-right, fixed) -->
    <button class="settings-icon" id="settings-icon" aria-label="Settings">⚙</button>

    <!-- Beat visualizer (top, smaller, subtle) -->
    <section class="visualizer-top">
      <div class="beats-container" id="beats-container">
        <!-- Generated by JS -->
      </div>
    </section>

    <!-- Click/Gap bar selectors (vertical scroll wheels) -->
    <section class="gap-pattern-section">
      <div class="pattern-wheel">
        <div class="wheel-label">Click</div>
        <div class="wheel-scroll" id="click-wheel">
          <!-- Generated by JS -->
        </div>
      </div>
      <div class="pattern-arrow">→</div>
      <div class="pattern-wheel">
        <div class="wheel-label">Gap</div>
        <div class="wheel-scroll" id="gap-wheel">
          <!-- Generated by JS -->
        </div>
      </div>
    </section>

    <!-- Large play button (~40% screen width), with the voice-count toggle to
         its left. The spacer on the right balances it so play stays centered. -->
    <section class="play-section-main">
      <div class="voice-control">
        <div class="wheel-label">Voice</div>
        <button class="voice-toggle" id="voice-toggle" aria-label="Count bars aloud" aria-pressed="false" title="Count bars aloud">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M4 9v6h4l5 5V4L8 9H4z"/>
            <path class="voice-wave" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6a8 8 0 0 1 0 12"/>
          </svg>
        </button>
      </div>
      <button class="play-btn-large" id="play-btn" aria-label="Start metronome">
        <svg class="play-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <polygon class="icon-play" points="30,18 82,50 30,82"
                   fill="currentColor" stroke="currentColor"
                   stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
          <g class="icon-pause">
            <rect x="20" y="18" width="22" height="64" rx="6" fill="currentColor"/>
            <rect x="58" y="18" width="22" height="64" rx="6" fill="currentColor"/>
          </g>
        </svg>
      </button>
      <div class="gap-section-spacer" aria-hidden="true"></div>
    </section>

    <!-- BPM rotary dial -->
    <section class="bpm-section-main">
      <button class="bpm-nudge" id="bpm-down" aria-label="Decrease BPM">−</button>
      <div class="rotary-dial-container">
        <canvas id="rotary-canvas" aria-label="BPM rotary dial"></canvas>
        <div class="rotary-center">
          <div class="tempo-name" id="tempo-name">Allegro</div>
          <div class="bpm-value-large" id="bpm-display">120</div>
          <div class="bpm-label-small">BPM</div>
        </div>
      </div>
      <button class="bpm-nudge" id="bpm-up" aria-label="Increase BPM">+</button>
    </section>

    <!-- Bottom controls (time sig, TAP, subdivision) -->
    <section class="bottom-controls">
      <button class="selector-btn" id="time-sig-btn" aria-label="Time signature">
        <span class="selector-label">Time</span>
        <span class="selector-value" id="time-sig-value">4/4</span>
      </button>

      <button class="tap-tempo-main" id="tap-tempo">TAP</button>

      <button class="selector-btn" id="subdivision-btn" aria-label="Subdivision">
        <span class="selector-label">Note</span>
        <span class="selector-value" id="subdivision-value">Quarter</span>
      </button>
    </section>

    <!-- Bar info overlay (subtle, top-center) -->
    <div class="bar-info-overlay" id="bar-info">
      <span class="mode" id="mode-display">CLICK</span> — Bar <span id="bar-display">1</span> of <span id="bar-total">4</span>
    </div>
  </div>

  <!-- Time Signature Picker -->
  <div class="picker-overlay" id="time-sig-picker">
    <div class="picker-sheet">
      <div class="picker-title">Time Signature</div>
      <div class="timesig-editor" id="time-sig-options"></div>
    </div>
  </div>

  <!-- Subdivision Picker -->
  <div class="picker-overlay" id="subdivision-picker">
    <div class="picker-sheet">
      <div class="picker-title">Subdivision</div>
      <div class="picker-grid" id="subdivision-options"></div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-backdrop" id="settings-backdrop"></div>
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="settings-close" id="settings-close" aria-label="Close settings">✕</button>
    </div>

    <div class="settings-content">
      <!-- Theme Selector -->
      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="theme-grid" id="theme-grid">
          <button class="theme-option" data-theme="light">Light</button>
          <button class="theme-option active" data-theme="dark">Dark</button>
        </div>
      </div>

      <!-- Sound Selector -->
      <div class="settings-section">
        <div class="settings-label">Click Sound</div>
        <div class="sound-grid" id="sound-grid">
          <button class="sound-option" data-sound="digital">Digital</button>
          <button class="sound-option" data-sound="mechanical">Mechanical</button>
          <button class="sound-option" data-sound="clave">Clave</button>
          <button class="sound-option" data-sound="cowbell">Cowbell</button>
          <button class="sound-option" data-sound="block">Block</button>
          <button class="sound-option" data-sound="shaker">Shaker</button>
        </div>
      </div>

      <!-- Accent Controls -->
      <div class="settings-section">
        <div class="settings-label">Accents</div>
        <div class="settings-toggle-row">
          <span>Accent beat 1</span>
          <button class="toggle active" id="settings-accent-one"></button>
        </div>
        <div class="settings-toggle-row">
          <span>Accent quarter notes</span>
          <button class="toggle active" id="settings-accent-quarters"></button>
        </div>
      </div>

      <!-- Display Options -->
      <div class="settings-section">
        <div class="settings-label">Display</div>
        <div class="settings-toggle-row">
          <span>Flash on pattern change</span>
          <button class="toggle" id="settings-flash"></button>
        </div>
      </div>

      <!-- Haptics -->
      <div class="settings-section">
        <div class="settings-label">Haptics</div>
        <div class="settings-toggle-row">
          <span>Vibrate on beats</span>
          <button class="toggle active" id="settings-vibrate"></button>
        </div>
      </div>

      <!-- Power Options -->
      <div class="settings-section">
        <div class="settings-label">Power</div>
        <div class="settings-toggle-row">
          <span>Keep screen awake</span>
          <button class="toggle" id="settings-wake-lock"></button>
        </div>
      </div>

      <!-- Preset Management -->
      <div class="settings-section">
        <div class="settings-label">Presets</div>
        <div class="preset-controls">
          <input type="text" class="preset-input" id="preset-name" placeholder="Preset name">
          <div class="preset-buttons">
            <button class="preset-btn" id="save-preset">Save</button>
            <button class="preset-btn" id="delete-preset">Delete</button>
          </div>
          <select class="preset-select" id="preset-select">
            <option value="">Load preset...</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Install prompt -->
  <div class="install-prompt" id="install-prompt">
    <p>Install for offline use</p>
    <button class="install-btn" id="install-btn">Install</button>
    <button class="dismiss-btn" id="dismiss-btn">×</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
