<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gap Metronome</title>
  <meta name="description" content="Practice metronome with gap training for developing internal timing">
  <meta name="theme-color" content="#1a1614">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Libre+Franklin:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Gap Metronome</h1>
      <p>Train your internal clock</p>
    </header>

    <div class="play-section">
      <button class="play-btn" id="play-btn">Start</button>
    </div>

    <section class="bpm-section">
      <div class="bpm-display">
        <button class="bpm-btn" id="bpm-down">−</button>
        <div class="bpm-value" id="bpm-display">120</div>
        <button class="bpm-btn" id="bpm-up">+</button>
      </div>
      <div class="bpm-label">Beats per minute</div>
      <button class="tap-tempo" id="tap-tempo">Tap Tempo</button>
    </section>

    <section class="visualizer">
      <div class="beats-container" id="beats-container">
        <!-- Generated by JS -->
      </div>
      <div class="bar-info">
        <span class="mode" id="mode-display">CLICK</span> — Bar <span id="bar-display">1</span> of <span id="bar-total">4</span>
      </div>
    </section>

    <div class="controls">
      <div class="control-card">
        <div class="control-label">Time Signature</div>
        <div class="control-value">
          <span id="time-sig">4/4</span>
          <div class="control-btns">
            <button class="ctrl-btn" id="time-down">−</button>
            <button class="ctrl-btn" id="time-up">+</button>
          </div>
        </div>
      </div>

      <div class="control-card">
        <div class="control-label">Subdivision</div>
        <div class="subdivision-pills">
          <button class="pill active" data-sub="1">♩</button>
          <button class="pill" data-sub="2">♪♪</button>
          <button class="pill" data-sub="4">𝅘𝅥𝅯</button>
        </div>
      </div>

      <div class="control-card full-width">
        <div class="control-label">Gap Pattern (bars)</div>
        <div class="gap-controls">
          <div class="gap-block">
            <div class="gap-adj">
              <button class="ctrl-btn" id="click-down">−</button>
              <button class="ctrl-btn" id="click-up">+</button>
            </div>
            <div class="gap-block-value" id="click-bars">4</div>
            <div class="gap-block-label">Click</div>
          </div>
          <div class="gap-arrow">→</div>
          <div class="gap-block">
            <div class="gap-adj">
              <button class="ctrl-btn" id="gap-down">−</button>
              <button class="ctrl-btn" id="gap-up">+</button>
            </div>
            <div class="gap-block-value gap" id="gap-bars">2</div>
            <div class="gap-block-label">Gap</div>
          </div>
        </div>
      </div>

      <div class="control-card full-width">
        <div class="control-label">Accents</div>
        <div class="accent-toggles">
          <div class="toggle-row">
            <span class="toggle-label">Accent beat 1</span>
            <button class="toggle active" id="accent-one"></button>
          </div>
          <div class="toggle-row">
            <span class="toggle-label">Accent all quarter notes</span>
            <button class="toggle active" id="accent-quarters"></button>
          </div>
        </div>
      </div>

      <!-- Preset Controls -->
      <div class="control-card full-width">
        <div class="control-label">Presets</div>
        <div class="preset-controls">
          <input type="text" id="preset-name" placeholder="Preset Name">
          <button class="ctrl-btn" id="save-preset">Save Preset</button>
          <select id="load-preset"></select>
          <button class="ctrl-btn" id="load-preset-btn">Load Preset</button>
        </div>
      </div>
    </div>
  </div>

  <div class="install-prompt" id="install-prompt">
    <p>Install for offline use</p>
    <button class="install-btn" id="install-btn">Install</button>
    <button class="dismiss-btn" id="dismiss-btn">×</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
